
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - Sampaikan Bouquet</title>

    <link rel="stylesheet" href="katalog.css">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">SAMPAIKAN.</a>

        <nav>
            <a href="index.html">BERANDA</a>
            <a href="katalog.html" class="active">KATALOG</a>
        </nav>
    </header>

    <main>

        <section class="catalog-header">
            <p class="subtitle">SAMPAIKAN BAHAGIAMU</p>
            <h1>OUR CATALOG</h1>
            <p class="description">
                Temukan bouquet spesial untuk orang tersayang.
            </p>
        </section>

        <section class="catalog-content">

            <div class="catalog-tools">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari bouquet..."
                >

                <div class="categories">
                    <button class="category active" data-category="all">
                        Semua
                    </button>

                    <button class="category" data-category="flower">
                        Flower
                    </button>

                    <button class="category" data-category="money">
                        Money
                    </button>

                    <button class="category" data-category="snack">
                        Snack
                    </button>
                </div>

            </div>

           <div class="product-grid" id="productGrid">
    <p>Memuat katalog...</p>
</div>

            <p id="emptyMessage" class="empty-message" hidden>
                Produk tidak ditemukan.
            </p>

        </section>

    </main>

    <footer>
        <p>@SAMPAIKANBOUQUET</p>
        <p>JAKARTA BARAT - ALAM SUTERA</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="katalog.js"></script>

</body>
</html>
